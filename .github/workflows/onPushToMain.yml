# test
name: version, tag and github release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to bump to (e.g. patch, minor, major, or specific version). Leave empty to just publish the current package.json version.'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4

      - name: Setup git
        if: ${{ github.event.inputs.version != '' }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Bump version
        if: ${{ github.event.inputs.version != '' }}
        run: |
          npm version ${{ github.event.inputs.version }} -m "chore: bump version to %s"
          git push origin HEAD:${{ github.ref_name }} --follow-tags

      - name: Check if version already exists
        id: version-check
        run: |
          package_version=$(node -p "require('./package.json').version")
          exists=$(gh api repos/${{ github.repository }}/releases/tags/v$package_version >/dev/null 2>&1 && echo "true" || echo "")

          if [ -n "$exists" ];
          then
            echo "Version v$package_version already exists"
            echo "::warning file=package.json,line=1::Version v$package_version already exists - no release will be created. If you want to create a new release, please update the version in package.json and push again."
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "Version v$package_version does not exist. Creating release..."
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "tag=v$package_version" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Github Release
        uses: ncipollo/release-action@2c591bcc8ecdcd2db72b97d6147f871fcd833ba5
        if: ${{ steps.version-check.outputs.skipped == 'false' }}
        with:
          name: ${{ steps.version-check.outputs.tag }}
          tag: ${{ steps.version-check.outputs.tag }}
          commit: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          skipIfReleaseExists: true

      - name: Install Dependencies
        if: ${{ steps.version-check.outputs.skipped == 'false' }}
        run: npm install

      - name: Build
        if: ${{ steps.version-check.outputs.skipped == 'false' }}
        run: npm run build

      - name: Prepack
        if: ${{ steps.version-check.outputs.skipped == 'false' }}
        run: npm run prepack

      - name: Publish to NPM
        uses: JS-DevTools/npm-publish@19c28f1ef146469e409470805ea4279d47c3d35c
        if: ${{ steps.version-check.outputs.skipped == 'false' }}
        with:
          token: ${{ secrets.NPM_TOKEN }}

      - name: Postpack
        if: ${{ steps.version-check.outputs.skipped == 'false' }}
        run: npm run postpack
